# Reference fragment for the Hermes gateway. The managed profile is published
# through the source-pinned TrueConf cutover.
platforms:
  trueconf:
    enabled: false
    extra:
      server_url: https://trueconf.invalid
      account_id: friday-product-placeholder
      account_role: product
      allowed_user_ids: []
      allowed_group_ids: []
      allowed_dm_chat_ids: []
      # Configure tester_user_id and tester_chat_id together after verifying
      # the dedicated Tester's direct chat with the product account.
      # tls_ca_file is optional for a privately trusted CA.
      # token_expires_at is required for the static token credential mode.
